<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="right">
        <nav>
          <a href="{{ '/about/' | relative_url }}">소개</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </nav>
        <button class="tt" id="tt" aria-label="테마 전환">◐</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    {{ content }}
  </div>

  <footer>© {{ 'now' | date: "%Y" }} {{ site.title }}</footer>

  <script>
    var root = document.documentElement;
    document.getElementById('tt').addEventListener('click', function () {
      var cur = root.getAttribute('data-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
