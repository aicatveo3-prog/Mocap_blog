name: 초안 PR 생성 + 슬랙 알림

# 루틴이 draft/* 브랜치를 push 하면:
#  1) base(발행) 브랜치로 향하는 PR을 자동 생성하고 (권한 없으면 compare 링크로 대체)
#  2) 슬랙 채널로 "검토해주세요" 알림을 보냅니다.
# 승인/발행은 슬랙 채널에서 @Claude 를 불러 처리합니다.
#   예) "@Claude PR #3 초안 보여줘"  →  "@Claude 발행해줘"
# PR은 사람이 승인해야만 발행됩니다.

on:
  push:
    branches:
      - "draft/**"

permissions:
  contents: read
  pull-requests: write

env:
  BASE_BRANCH: claude/ai-mocap-blog-automation-o273mo

jobs:
  open-pr-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR 생성 시도 (실패 시 compare 링크로 대체)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url' 2>/dev/null || true)
          if [ -z "$URL" ]; then
            URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "📝 자동 초안: $BRANCH" \
              --body $'AI가 생성한 초안입니다.\n\n- **병합(Merge)** = 발행 ✅\n- **코멘트** = 수정요청 💬\n- **닫기(Close)** = 폐기 ❌\n\n슬랙에서 "@Claude 발행해줘" 라고 불러도 됩니다.' 2>/dev/null || true)
          fi
          if [ -z "$URL" ]; then
            URL="https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${BRANCH}?expand=1"
            echo "⚠️ Actions의 PR 자동생성 권한이 없어 compare 링크로 대체합니다."
          fi
          # URL 에서 PR 번호 추출 (…/pull/1 → 1)
          NUM=""
          case "$URL" in
            *"/pull/"*) NUM="${URL##*/pull/}"; NUM="${NUM%%[!0-9]*}";;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

      - name: 새 글 제목 추출
        id: titles
        run: |
          git fetch --no-tags origin "$BASE_BRANCH" || true
          FILES=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD" -- '_posts/*.md' 2>/dev/null || true)
          LIST=""
          for f in $FILES; do
            [ -f "$f" ] || continue
            T=$(grep -m1 '^title:' "$f" | sed -E 's/^title:[[:space:]]*//; s/^"(.*)"$/\1/')
            [ -n "$T" ] && LIST="${LIST}• ${T}"$'\n'
          done
          {
            echo "list<<__EOF__"
            printf '%s' "$LIST"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: 슬랙 알림 전송
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          URL: ${{ steps.pr.outputs.url }}
          NUM: ${{ steps.pr.outputs.num }}
          TITLES: ${{ steps.titles.outputs.list }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 시크릿이 없습니다. (저장소 → Settings → Secrets and variables → Actions 에 추가하세요)"
            exit 1
          fi
          [ -n "$URL" ] || URL="https://github.com/${GITHUB_REPOSITORY}/branches"
          PRLABEL="${NUM:-N}"
          TEXT=$(printf '📝 *오늘의 AI 모션캡쳐 초안이 준비됐어요.*\n\n%s\n🔗 검토: %s\n\n이 채널에서 이렇게 불러주세요:\n• `@Claude PR #%s 초안 보여줘`\n• 마음에 들면 `@Claude PR #%s 발행해줘`\n• 고치고 싶으면 `@Claude PR #%s 이렇게 고쳐줘: (내용)`' "$TITLES" "$URL" "$PRLABEL" "$PRLABEL" "$PRLABEL")
          # 슬랙 Incoming Webhook 으로 전송 (JSON 이스케이프는 jq 로 안전 처리)
          PAYLOAD=$(printf '%s' "$TEXT" | jq -Rs '{text: .}')
          RESP=$(curl -sS -X POST -H 'content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL")
          if [ "$RESP" = "ok" ]; then
            echo "슬랙 전송 성공"
          else
            echo "슬랙 전송 실패: $RESP"; exit 1
          fi
