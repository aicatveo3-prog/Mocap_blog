name: 매일 AI 모션캡쳐 글 자동 생성

on:
  schedule:
    # 매일 06:00 KST (= 21:00 UTC) 실행. 필요하면 시간을 바꾸세요.
    - cron: "0 21 * * *"
  workflow_dispatch: # 저장소 Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r automation/requirements.txt

      - name: 글 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-8' }}
          POSTS_PER_RUN: "2"
        run: python automation/generate_posts.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain _posts)" ]; then
            git add _posts
            git commit -m "chore: 자동 생성 글 ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "새로 생성된 글이 없습니다."
          fi
